<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Photos</title>
    <script src="js.js?v=11"></script>
    <link rel="stylesheet" href="index.css?v=11">
     <script>
        fetch('/api/random-emoji').then(r => r.json()).then(d => {
            if (d.emoji) document.getElementById('favicon-link').href = d.emoji;
        });
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" id="favicon-link">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cosette+Texte:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-wrapper">
        <!-- Left Side Column -->
        <aside class="side-column left">
                <div class="hit-counter">
                    <span class="hit-counter-label">PHOTOS</span>
                    <span id="photo-count-display">---</span>
                </div>
                <span class="sticker sticker-cool" style="font-size: 10px;">KEEP IT COOL!</span>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Wavy Rainbow Banner -->
            <div class="topthing">
                <h2>Awesome Photos!</h2>
            </div>

            <!-- Retro Stickers -->
            <div class="retro-stickers">
                <span class="sticker sticker-star">PHOTOS</span>
                <span class="sticker sticker-sugar">GALLERY</span>
                <span class="sticker sticker-cool">SNAPSHOTS</span>
            </div>

            <!-- Navigation -->
            <nav class="nav-bar">
                <a href="/">Home</a>
                <a href="/gallery">Photos</a>
                <a href="/guestbook">Guestbook</a>
            </nav>

            <div class="content">
                <p class="something">Look at these awesome photos! Or, <a href="/">go back home</a></p>

                <div class="gallery-container">
                    <div id="loading" class="loading">Loading photos...</div>
                    <div id="photo-grid" class="photo-grid"></div>
                    <div id="no-photos" class="no-photos" style="display: none;">No photos yet! Maybe theres an error?</div>
                </div>
            </div>
        </main>

        <!-- Right Side Column -->
        <aside class="side-column right">
                <p id="photo-count-sidebar" style="display: none;">Loading...</p>
                <span class="sticker sticker-fire" style="font-size: 10px;">WE <3 PICTURES!</span>
                <span class="sticker sticker-happy" style="font-size: 10px;">WE ALSO <3 SCREENSHOTS!</span>
        </aside>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <!-- Footer -->
    <div class="site-footer">
        <p id="footer-text">Pics from the Discord fam ~ yoforduer.org</p>
    </div>

    <script>
        // Random footer messages
        const footerMessages = [
            "we <3 pictures! ~ yoforduer.org",
            "#jerkin it ~ yoforduer.org",
            "two men could do unspeakable things ~ yoforduer.org",
            "55 taco 55 pies ~ yoforduer.org",
            "i dont remember anything ~ yoforduer.org",
            "we go ~ yoforduer.org"
        ];
        document.getElementById('footer-text').textContent = footerMessages[Math.floor(Math.random() * footerMessages.length)];

        async function loadPhotos() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('photo-grid');
            const noPhotos = document.getElementById('no-photos');
            const photoCountSidebar = document.getElementById('photo-count-sidebar');
            const photoCountDisplay = document.getElementById('photo-count-display');

            try {
                const response = await fetch('/api/photos');
                const photos = await response.json();

                loading.style.display = 'none';
                grid.innerHTML = '';

                if (photos.length === 0) {
                    noPhotos.style.display = 'block';
                    photoCountSidebar.textContent = '0 photos';
                    photoCountDisplay.textContent = '000';
                    return;
                }

                noPhotos.style.display = 'none';
                const countStr = String(photos.length).padStart(3, '0');
                photoCountSidebar.textContent = photos.length + ' photos';
                photoCountDisplay.textContent = countStr;

                photos.forEach(photo => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';

                    const formattedDate = new Date(photo.timestamp).toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric'
                    });

                    const img = document.createElement('img');
                    img.className = 'photo-image';
                    img.src = photo.imageUrl;
                    img.alt = 'Photo by ' + photo.username;
                    img.onclick = () => openLightbox(photo.imageUrl);

                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'photo-info';

                    const pfpImg = document.createElement('img');
                    pfpImg.className = 'photo-pfp';
                    pfpImg.src = photo.avatarUrl;
                    pfpImg.alt = photo.username + "'s avatar";

                    const usernameSpan = document.createElement('span');
                    usernameSpan.className = 'photo-username';
                    usernameSpan.textContent = photo.displayName || photo.username;

                    const timestampSpan = document.createElement('span');
                    timestampSpan.className = 'photo-timestamp';
                    timestampSpan.textContent = formattedDate;

                    infoDiv.appendChild(pfpImg);
                    infoDiv.appendChild(usernameSpan);
                    infoDiv.appendChild(timestampSpan);

                    card.appendChild(img);
                    card.appendChild(infoDiv);

                    grid.appendChild(card);
                });
            } catch (error) {
                loading.textContent = 'Error loading photos! Is the server running?';
                console.error('Error loading photos:', error);
            }
        }

        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        loadPhotos();
    </script>
</body>
</html>
